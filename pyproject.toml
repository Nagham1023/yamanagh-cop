[project]
name = "cop"
version = "0.1.0"
description = "Cop peer for the Distributed Cops-and-Robbers P2P game (Orchestration of AI Agents, University of Haifa)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ holds bundled skill/agent tooling (spec-guard, etc.), not project
# source — it isn't ours to lint or reformat.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cop"]
