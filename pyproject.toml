[project]
name = "cop"
version = "0.1.0"
description = "Cop peer for the Distributed Cops-and-Robbers P2P game (Orchestration of AI Agents, University of Haifa)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.6",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ holds bundled skill/agent tooling (spec-guard, etc.), not project
# source — it isn't ours to lint or reformat.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# "training" (repo root, not under src/) is PRD 11's offline-only pipeline
# tooling — installed alongside "cop" so `import training` resolves the
# same way `import cop` does, in scripts and tests alike. Never imported
# from src/cop/ itself (tests/unit/test_training_boundary.py enforces
# that one-directional edge); packaging it doesn't change that boundary.
packages = ["src/cop", "training"]
